<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JavaScript</title>
</head>

<body style="background-color: #414141; color: aliceblue;">
    <h2>Code-Image</h2>
    <div>
        <ul id="images">
            <li><img width="200px" src="Assets/image1.png" alt="code1" id="code"></li>
            <li><img width="200px" src="Assets/image2.png" alt="" id="timeline"></li>

            <!-- Event in JS - this approach is not a practice for big database -->
            <li><img width="200px" src="Assets/image3.png" alt="" id="window" onclick="alert('window clicked')"></li>

            <ul><a style="color: aliceblue;" href="https://google.com">Google</a></ul>
        </ul>
    </div>
</body>

<script>
    // ❌ Not best practice but works
    document.getElementById('timeline').onclick = function () {
        alert("timeline clicked");
    }

    // ✅ Better approach using addEventListener
    document.getElementById('code').addEventListener('click', function (e) {
        console.log("clicked inside the ul");
        alert("code clicked")
        e.stopPropagation(); // Prevents bubbling to parent
    }, false);

    // ✅ Taking all images at once
    document.querySelector('#images').addEventListener('click', function (e) {
        console.log(e.target.parentNode);
        let removeIt = e.target.parentNode;
        removeIt.remove();
    });
</script>

</html>
