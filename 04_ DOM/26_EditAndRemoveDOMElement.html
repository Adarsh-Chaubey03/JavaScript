<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCUMENT OBJECT MODEL</title>
</head>

<body style="background-color: rgb(86, 81, 73); color: #ebbbbb;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>

</body>

<script>
    // function to add element
    function addLanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage("Python");

    // better optimised function to add element
    function addOLanguage(langName) {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOLanguage('goLang')



    // Edit element 
    const secLang = document.querySelector('li:nth-child(2)')
    // secLang.innerHTML= "Mozo"   // not a better approach
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secLang.replaceWith(newli)


// remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
</script>

</html>
